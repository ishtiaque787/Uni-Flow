<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem("uniflow-theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>UniFlow — More</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">
<main class="main-scroll">
<div class="screen-pad">

  <div class="card fade-up" style="overflow:hidden;">
    <div class="flex items-center gap-4" style="padding:1.25rem;">
      <div class="icon-chip flex items-center justify-center flex-shrink-0" style="width:56px;height:56px;border-radius:16px;"><i data-lucide="user" style="width:24px;height:24px;color:#fff;"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-foreground truncate" style="font-size:1.05rem; font-weight:600; letter-spacing:-0.015em;">Ishtiaque Ahmed</p>
        <p class="font-mono text-muted mt-0-5 truncate" style="font-size:0.6rem; letter-spacing:0.12em;">SOFTWARE ENGINEERING · YEAR 3</p>
      </div>
      <div class="flex-shrink-0 text-right">
        <span class="text-primary" style="font-size:1.5rem; font-weight:700; letter-spacing:-0.025em;">3.72</span>
        <p class="font-mono text-muted" style="font-size:0.5rem; letter-spacing:0.16em;">GPA</p>
      </div>
    </div>
    <div class="hr" style="margin:0 1.25rem;"></div>
    <div class="grid grid-3 divide-x">
      <div class="stat-block" style="padding:0.875rem 0;"><span class="stat-value" style="font-size:1rem;">5</span><span class="stat-label">Courses</span></div>
      <div class="stat-block" style="padding:0.875rem 0;"><span class="stat-value" style="font-size:1rem;">15</span><span class="stat-label">Credits</span></div>
      <div class="stat-block" style="padding:0.875rem 0;"><span class="stat-value" style="font-size:1rem;">7d</span><span class="stat-label">Streak</span></div>
    </div>
  </div>

  <div class="flex flex-col gap-5">
    <div class="fade-up fade-up-1">
      <p class="font-mono text-muted mb-2" style="font-size:0.55rem; letter-spacing:0.2em; padding:0 0.25rem;">ACADEMIC</p>
      <div class="card" style="overflow:hidden;">
        <a href="attendance.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="bar-chart-2" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Attendance</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="assignments.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="clipboard-list" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Assignments</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="exams.html" class="row-link flex items-center justify-between" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="file-text" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Exams</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
      </div>
    </div>

    <div class="fade-up fade-up-2">
      <p class="font-mono text-muted mb-2" style="font-size:0.55rem; letter-spacing:0.2em; padding:0 0.25rem;">CAMPUS</p>
      <div class="card" style="overflow:hidden;">
        <a href="notices.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="megaphone" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Notices</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="events.html" class="row-link flex items-center justify-between" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="calendar-days" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Events</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
      </div>
    </div>

    <div class="fade-up fade-up-3">
      <p class="font-mono text-muted mb-2" style="font-size:0.55rem; letter-spacing:0.2em; padding:0 0.25rem;">ACCOUNT</p>
      <div class="card" style="overflow:hidden;">
        <a href="notifications.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="bell" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Notifications</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="profile.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="user" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Profile</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="settings.html" class="row-link flex items-center justify-between border-b" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="shield" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Privacy</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
        <a href="settings.html" class="row-link flex items-center justify-between" style="padding:0.875rem 1.25rem; text-decoration:none;">
          <div class="flex items-center gap-3"><div class="row-icon" style="width:32px;height:32px;"><i data-lucide="settings" style="width:15px;height:15px;"></i></div><span class="text-foreground" style="font-size:0.875rem; font-weight:500;">Settings</span></div>
          <i data-lucide="chevron-right" class="text-muted" style="width:15px;height:15px;"></i>
        </a>
      </div>
    </div>

    <a href="login.html" class="btn-danger-outline fade-up fade-up-4" style="text-decoration:none;">
      <i data-lucide="log-out" style="width:15px;height:15px;"></i>
      Sign Out
    </a>
  </div>

</div>
</main>

<div class="bottom-nav-wrap">
  <nav class="card bottom-nav">
    <a href="home.html" class="nav-item"><i data-lucide="home"></i><span>HOME</span></a>
    <a href="timetable.html" class="nav-item"><i data-lucide="calendar-days"></i><span>CLASSES</span></a>
    <a href="courses.html" class="nav-item"><i data-lucide="book-open"></i><span>COURSES</span></a>
    <a href="more.html" class="nav-item active"><i data-lucide="layout-grid"></i><span>MORE</span></a>
  </nav>
</div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
</body>
</html>
