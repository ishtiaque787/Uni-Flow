<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem("uniflow-theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>UniFlow</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame" style="align-items:center; justify-content:center;">

  <div class="flex flex-col items-center gap-6" style="animation:fadeUp .8s cubic-bezier(.22,1,.36,1) both;">
    <div class="orb-orange relative flex items-center justify-center" style="width:104px; height:104px;">
      <i data-lucide="sparkles" style="width:36px; height:36px; color:#fff;"></i>
    </div>
    <div class="text-center" style="animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .35s both;">
      <h1 class="text-foreground" style="font-size:2.4rem; font-weight:700; letter-spacing:-0.04em; line-height:1;">UniFlow</h1>
      <p class="text-muted mt-3" style="font-size:0.85rem; letter-spacing:-0.01em;">Your Academic Operating System</p>
    </div>
  </div>

  <div class="absolute" style="bottom:64px; left:64px; right:64px;">
    <div style="height:3px; background:var(--border); overflow:hidden; border-radius:999px;">
      <div class="bar-primary" style="height:100%; width:100%; border-radius:999px; animation: splashBar 1.4s cubic-bezier(.22,1,.36,1) .8s both;"></div>
    </div>
  </div>

  <a href="onboarding.html" class="text-muted" style="position:absolute; bottom:20px; right:20px; font-size:0.7rem;">Skip →</a>
</div>

<style>
  @keyframes splashBar { from { width: 0%; } to { width: 100%; } }
</style>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
<script>
  setTimeout(() => { window.location.href = 'onboarding.html'; }, 2600);
</script>
</body>
</html>
