<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem("uniflow-theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>UniFlow — Attendance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">
  <header class="sub-header">
    <a href="more.html" class="icon-btn" style="text-decoration:none;"><i data-lucide="chevron-left" style="width:18px;height:18px;"></i></a>
    <div class="flex-1 min-w-0"><h1 class="truncate">Attendance</h1></div>
  </header>

  <main class="sub-main fade-up">
    <div class="flex flex-col gap-6">

      <div class="card flex flex-col items-center" style="padding:2rem 0;">
        <div class="relative flex items-center justify-center" style="width:168px; height:168px;">
          <svg width="168" height="168" style="transform:rotate(-90deg);">
            <circle cx="84" cy="84" r="78" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
            <circle cx="84" cy="84" r="78" fill="none" stroke="url(#ringGrad2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="63.7"/>
            <defs><linearGradient id="ringGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB061"/><stop offset="100%" stop-color="#E8590C"/></linearGradient></defs>
          </svg>
          <div class="absolute flex flex-col items-center">
            <span class="text-foreground" style="font-size:44px; font-weight:700; letter-spacing:-0.03em; line-height:1;">87%</span>
            <span class="font-mono text-muted mt-1-5" style="font-size:0.58rem; letter-spacing:0.16em;">OVERALL ATTENDANCE</span>
          </div>
        </div>
      </div>

      <div>
        <p class="label">By Course</p>
        <div class="card" style="overflow:hidden;">
          <div class="flex items-center gap-4 border-b" style="padding:1rem 1.25rem;">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-2"><p class="truncate" style="font-size:0.875rem; font-weight:500;">Database Systems</p></div>
              <div class="progress-track" style="height:6px;"><div class="progress-fill bar-primary" style="width:87%;"></div></div>
            </div>
            <span class="text-foreground flex-shrink-0" style="font-size:1rem; font-weight:700; letter-spacing:-0.02em;">87%</span>
          </div>
          <div class="flex items-center gap-4 border-b" style="padding:1rem 1.25rem;">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-2"><p class="truncate" style="font-size:0.875rem; font-weight:500;">Software Engineering</p></div>
              <div class="progress-track" style="height:6px;"><div class="progress-fill bar-primary" style="width:92%;"></div></div>
            </div>
            <span class="text-foreground flex-shrink-0" style="font-size:1rem; font-weight:700; letter-spacing:-0.02em;">92%</span>
          </div>
          <div class="flex items-center gap-4 border-b" style="padding:1rem 1.25rem;">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-2"><p class="truncate" style="font-size:0.875rem; font-weight:500;">Mathematics</p></div>
              <div class="progress-track" style="height:6px;"><div class="progress-fill bar-primary" style="width:84%;"></div></div>
            </div>
            <span class="text-foreground flex-shrink-0" style="font-size:1rem; font-weight:700; letter-spacing:-0.02em;">84%</span>
          </div>
          <div class="flex items-center gap-4" style="padding:1rem 1.25rem;">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-2"><p class="truncate" style="font-size:0.875rem; font-weight:500;">Physics</p><i data-lucide="alert-triangle" class="text-error flex-shrink-0" style="width:13px;height:13px;"></i></div>
              <div class="progress-track" style="height:6px;"><div class="progress-fill" style="width:78%; background:var(--error);"></div></div>
            </div>
            <span class="text-error flex-shrink-0" style="font-size:1rem; font-weight:700; letter-spacing:-0.02em;">78%</span>
          </div>
        </div>
      </div>

      <div>
        <p class="label">Attendance History</p>
        <div class="card" style="padding:1.25rem;">
          <div class="grid grid-7 gap-2">
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Mon</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Tue</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Wed</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Thu</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Fri</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Sat</div>
            <div class="text-center font-mono text-muted" style="font-size:0.55rem; letter-spacing:0.05em;">Sun</div>

            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--primary-subtle); color:var(--primary-strong); font-size:0.8rem; font-weight:600;">4</div></div>
            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--primary-subtle); color:var(--primary-strong); font-size:0.8rem; font-weight:600;">5</div></div>
            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--error-subtle); color:var(--error); font-size:0.8rem; font-weight:600;">6</div></div>
            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--primary-subtle); color:var(--primary-strong); font-size:0.8rem; font-weight:600;">7</div></div>
            <div class="flex justify-center"><div class="icon-chip flex items-center justify-center text-white" style="width:36px;height:36px;border-radius:12px; font-size:0.8rem; font-weight:600;">8</div></div>
            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--surface-2); color:var(--muted-foreground); font-size:0.8rem; font-weight:600;">9</div></div>
            <div class="flex justify-center"><div class="flex items-center justify-center" style="width:36px;height:36px;border-radius:12px; background:var(--surface-2); color:var(--muted-foreground); font-size:0.8rem; font-weight:600;">10</div></div>
          </div>
          <div class="flex items-center gap-4 mt-5 pt-4 border-t">
            <div class="flex items-center gap-1-5"><span style="width:10px;height:10px;border-radius:4px; background:var(--primary-subtle);"></span><span class="text-muted" style="font-size:0.7rem;">Present</span></div>
            <div class="flex items-center gap-1-5"><span style="width:10px;height:10px;border-radius:4px; background:var(--error-subtle);"></span><span class="text-muted" style="font-size:0.7rem;">Absent</span></div>
            <div class="flex items-center gap-1-5"><span class="icon-chip" style="width:10px;height:10px;border-radius:4px;"></span><span class="text-muted" style="font-size:0.7rem;">Today</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
</body>
</html>
