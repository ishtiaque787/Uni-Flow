<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem("uniflow-theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>UniFlow — Midterm Examination</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">
  <header class="sub-header">
    <a href="exams.html" class="icon-btn" style="text-decoration:none;"><i data-lucide="chevron-left" style="width:18px;height:18px;"></i></a>
    <div class="flex-1 min-w-0"><h1 class="truncate">Midterm Examination</h1></div>
  </header>

  <main class="sub-main fade-up">
    <div class="flex flex-col gap-6">
      <div class="card flex items-center gap-3-5" style="padding:1.25rem;">
        <div class="icon-chip flex items-center justify-center flex-shrink-0" style="width:48px;height:48px;border-radius:16px;"><i data-lucide="graduation-cap" style="width:20px;height:20px;color:#fff;"></i></div>
        <div>
          <p style="font-size:1rem; font-weight:600;">Database Systems</p>
          <p class="text-muted mt-0-5" style="font-size:0.78rem;">CSE 301 · Midterm</p>
        </div>
      </div>

      <div class="card" style="overflow:hidden;">
        <div class="flex items-center justify-between border-b" style="padding:1rem 1.25rem;">
          <span class="font-mono text-muted" style="font-size:0.65rem; letter-spacing:0.12em;">DATE</span>
          <span style="font-size:0.9rem; font-weight:600;">20 Sep, 2030</span>
        </div>
        <div class="flex items-center justify-between border-b" style="padding:1rem 1.25rem;">
          <span class="font-mono text-muted" style="font-size:0.65rem; letter-spacing:0.12em;">TIME</span>
          <span style="font-size:0.9rem; font-weight:600;">09:00 AM</span>
        </div>
        <div class="flex items-center justify-between" style="padding:1rem 1.25rem;">
          <span class="font-mono text-muted" style="font-size:0.65rem; letter-spacing:0.12em;">ROOM</span>
          <span style="font-size:0.9rem; font-weight:600;">Room 301</span>
        </div>
      </div>

      <div>
        <p class="label">Preparation Tips</p>
        <div class="card flex flex-col gap-3" style="padding:1.25rem;">
          <div class="flex items-center gap-3"><i data-lucide="check-circle-2" class="text-primary flex-shrink-0" style="width:16px;height:16px;"></i><span style="font-size:0.875rem;">Review key concepts</span></div>
          <div class="flex items-center gap-3"><i data-lucide="check-circle-2" class="text-primary flex-shrink-0" style="width:16px;height:16px;"></i><span style="font-size:0.875rem;">Solve past papers</span></div>
          <div class="flex items-center gap-3"><i data-lucide="check-circle-2" class="text-primary flex-shrink-0" style="width:16px;height:16px;"></i><span style="font-size:0.875rem;">Focus on normalization</span></div>
        </div>
      </div>

      <div>
        <p class="label">Syllabus / Attachments</p>
        <div class="card flex items-center gap-3" style="padding:0.875rem 1rem;">
          <div class="row-icon" style="width:36px;height:36px;border-radius:8px;"><i data-lucide="file-text" style="width:15px;height:15px;"></i></div>
          <div class="flex-1 min-w-0"><p style="font-size:0.85rem; font-weight:500;">syllabus.pdf</p><p class="font-mono text-muted mt-0-5" style="font-size:0.6rem;">PDF · 1.2 MB</p></div>
        </div>
      </div>

      <button class="btn btn-ink" style="margin-top:0.25rem;">View Details</button>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
</body>
</html>
